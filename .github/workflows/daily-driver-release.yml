name: Daily-driver release

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Current capability to validate
        type: choice
        required: true
        default: session-query
        options: [session-query, core, access]
      tag:
        description: Existing immutable daily-driver-* tag at the selected source ref
        type: string
        required: true
      pi_tarball_url:
        description: Immutable qualified Pi 1.1.0-fork tarball URL (required for core)
        type: string
      packages:
        description: Optional space-separated package directories to publish (default entire selection)
        type: string

permissions:
  contents: write

concurrency:
  group: daily-driver-release
  cancel-in-progress: false

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate, build, smoke and publish immutable assets
        env:
          SELECTION: ${{ inputs.selection || 'session-query' }}
          RELEASE_TAG: ${{ inputs.tag }}
          SELECTED_PACKAGES: ${{ inputs.packages }}
          PI_TARBALL_URL: ${{ inputs.pi_tarball_url }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTION" == core ]]; then
            test -n "$PI_TARBALL_URL" || { echo "core requires an immutable qualified Pi tarball URL" >&2; exit 1; }
            export DSH_PI_AI_TARBALL="$RUNNER_TEMP/pi-ai.tgz"
            curl --fail --location --retry 2 --output "$DSH_PI_AI_TARBALL" "$PI_TARBALL_URL"
          fi
          read -r -a packages <<< "$SELECTED_PACKAGES"
          node scripts/daily-driver.mjs release "$SELECTION" "${packages[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-release-artifacts
          path: dist/daily-driver/*
          if-no-files-found: error
