name: Daily-driver pinned package release

on:
  push:
    tags:
      - 'daily-driver-v*-fork*'
  workflow_dispatch:
    inputs:
      subagent_only:
        description: Publish only the pinned fork2 subagent from its existing immutable tag
        required: false
        default: false
        type: boolean
      firecrawl_tarball_url:
        description: Immutable URL of the adapted Firecrawl fork1 tarball
        required: false
        type: string
      overlay_ref:
        description: Exact tested source commit for workspace overlay
        required: false
        type: string
      envrc_ref:
        description: Exact tested source commit for workspace envrc
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-driver-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  BASE_VERSION: 0.1.7-rc.2
  FORK_VERSION: 0.1.7-rc.2-fork1
  PI_RELEASE: daily-driver-v0.1.5-rc.2-fork1

jobs:
  subagent-fork2:
    if: (github.event_name == 'push' && github.ref == 'refs/tags/daily-driver-v0.1.7-rc.2-fork2') || (github.event_name == 'workflow_dispatch' && inputs.subagent_only)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: daily-driver-v0.1.7-rc.2-fork2
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.24.0
          package_json_file: packages/subagent/subagent/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify subagent-only release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            test "$GITHUB_REF_NAME" = daily-driver-v0.1.7-rc.2-fork2
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/tags/daily-driver-v0.1.7-rc.2-fork2)"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const version = path => JSON.parse(readFileSync(path, 'utf8')).version
          assert.equal(version('apps/cli/package.json'), '0.1.7-rc.2')
          assert.equal(version('packages/bundle/web-app/package.json'), '0.1.7-rc.2')
          for (const [path, expected] of [
            ['subagent/subagent', '0.1.7-rc.2-fork2'],
            ['llm/llm-pi-ai', '0.1.7-rc.2-fork1'],
            ['mcp/mcp-client', '0.1.7-rc.2-fork1'],
            ['core/agent', '0.1.7-rc.2-fork1'],
            ['preset/agent-preset-registry', '0.1.7-rc.2-fork1'],
          ]) assert.equal(version(`packages/${path}/package.json`), expected, path)
          NODE
          git merge-base --is-ancestor 477b4f420553e8a52c2fbccc464d7561b239c443 HEAD
      - name: Install source with pinned Pi fork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/daily-driver
          gh release download "$PI_RELEASE" --repo TTTPOB/deepseek-harness \
            --pattern 'earendil-works-pi-ai-0.85.1-fork1.tgz' --dir dist/daily-driver
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'pnpm-workspace.yaml'
          const source = readFileSync(path, 'utf8')
          const marker = '\npeerDependencyRules:'
          if (!source.includes(marker)) throw new Error('Missing workspace override insertion point')
          writeFileSync(path, source.replace(marker, "\n  '@earendil-works/pi-ai': 'file:dist/daily-driver/earendil-works-pi-ai-0.85.1-fork1.tgz'\n\nblockExoticSubdeps: false\n" + marker)
            .replace("  '@earendil-works/pi-ai@0.85.1': patches/@earendil-works__pi-ai@0.85.1.patch\n", ''))
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          manifest.packageManager = 'pnpm@11.24.0'
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          actual_pnpm=$(pnpm --version)
          echo "Release pnpm: $actual_pnpm"
          test "$actual_pnpm" = 11.24.0
          pnpm install --no-frozen-lockfile
      - name: Run focused continuation regression
        run: |
          pnpm run build:native-system
          pnpm exec vitest run packages/subagent/subagent/tests/continuation.spec.ts
      - name: Build and pack only subagent
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json packages/subagent/subagent/tsconfig.json
          pnpm exec tsdown -F '@deepseek-ai/dsh-subagent' --env.DSH_BUILD_FACE host
          pnpm --dir packages/subagent/subagent pack --pack-destination "$PWD/dist/daily-driver"
      - name: Smoke installed tarball and record checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="$PWD/dist/daily-driver/deepseek-ai-dsh-subagent-0.1.7-rc.2-fork2.tgz"
          test -s "$asset"
          runtime=$(mktemp -d)
          trap 'rm -rf "$runtime"' EXIT
          cp "$asset" "$runtime/"
          printf '{"name":"subagent-fork2-smoke","private":true,"type":"module","packageManager":"pnpm@11.24.0","dependencies":{"@deepseek-ai/dsh":"0.1.7-rc.2"}}\n' > "$runtime/package.json"
          printf "packages:\n  - .\nblockExoticSubdeps: false\noverrides:\n  '@deepseek-ai/dsh-subagent': 'file:./%s'\n" "$(basename "$asset")" > "$runtime/pnpm-workspace.yaml"
          (cd "$runtime" && pnpm install --ignore-scripts)
          SMOKE_RUNTIME="$runtime" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, realpathSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const runtime = process.env.SMOKE_RUNTIME
          const require = createRequire(join(runtime, 'package.json'))
          const cli = createRequire(require.resolve('@deepseek-ai/dsh/package.json'))
          const base = createRequire(cli.resolve('@deepseek-ai/dsh-base/package.json'))
          const manifest = base.resolve('@deepseek-ai/dsh-subagent/package.json')
          assert.match(realpathSync(manifest), /file\+/)
          assert.equal(JSON.parse(readFileSync(manifest, 'utf8')).version, '0.1.7-rc.2-fork2')
          const loaded = await import(pathToFileURL(base.resolve('@deepseek-ai/dsh-subagent')).href)
          assert(Object.keys(loaded).length > 0, 'Installed built entry has exports')
          const directory = realpathSync(manifest).slice(0, -'/package.json'.length)
          const { ContinuableActivationRegistry, ChildLock } = await import(pathToFileURL(join(directory, 'lib/types/continuation-activation.js')).href)
          const { SubagentContinuationManager } = await import(pathToFileURL(join(directory, 'lib/types/continuation.js')).href)
          const agents = [
            { id: 'root', session: { header: {} } },
            { id: 'a', session: { header: { parentSession: 'root' } } },
            { id: 'b', session: { header: { parentSession: 'root' } } },
          ]
          const [root, a, b] = agents
          const live = new Map(agents.map(agent => [agent.id, agent]))
          const ctx = { agents: { get: id => live.get(id) } }
          const registry = Object.create(ContinuableActivationRegistry.prototype)
          registry.ctx = ctx
          registry.resident = new Map()
          registry.closingScopes = new Map()
          registry.draining = false
          registry.locks = new ChildLock()
          for (const child of [a, b]) {
            registry.resident.set(child.id, {
              childId: child.id, parentSession: root.id, handle: { agent: child },
              inbox: { closing: undefined, hasPending: false },
              ownedChildren: new Set(), poke: Promise.withResolvers(),
            })
          }
          const manager = Object.create(SubagentContinuationManager.prototype)
          manager.ctx = ctx
          manager.activations = registry
          const signal = new AbortController().signal
          for (const [sender, target] of [[a, b], [b, a]]) {
            await assert.rejects(manager.sendMessage(sender, target.id, [{ type: 'text', text: 'cross-sibling' }], { signal }), /belongs to another parent session/)
          }
          for (const child of [a, b]) {
            const activation = registry.resident.get(child.id)
            assert.equal(activation.ownedChildren.size, 0, child.id)
            assert.equal(registry.settlementState(activation, activation.poke), 'ready', child.id)
          }
          console.log(`Resolved ${realpathSync(manifest)}; imported built entry; rejected sibling messages without orphaned holds`)
          NODE
          (cd dist/daily-driver && sha256sum deepseek-ai-dsh-subagent-0.1.7-rc.2-fork2.tgz > SHA256SUMS)
      - name: Preserve verified subagent release assets
        uses: actions/upload-artifact@v4
        with:
          name: subagent-fork2-release
          path: |
            dist/daily-driver/deepseek-ai-dsh-subagent-0.1.7-rc.2-fork2.tgz
            dist/daily-driver/SHA256SUMS
          if-no-files-found: error
      - name: Publish immutable subagent-only release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=daily-driver-v0.1.7-rc.2-fork2
          current=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          test "$current" = "$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          cd dist/daily-driver
          gh release create "$tag" deepseek-ai-dsh-subagent-0.1.7-rc.2-fork2.tgz SHA256SUMS \
            --verify-tag --title "$tag" --latest \
            --notes 'Only @deepseek-ai/dsh-subagent advances to 0.1.7-rc.2-fork2. Keep the four other DSH fork1 overrides, Pi AI fork1, official CLI/Web, and existing independent plugins unchanged. Replace only the @deepseek-ai/dsh-subagent pnpm global override with this tarball, then run pnpm global add for @deepseek-ai/dsh@0.1.7-rc.2 using the existing installation procedure. The isolated smoke checks installed dependency resolution, built-entry import, and rejected cross-sibling messages without orphaned ownership; it does not verify Loader activation. This release contains no other package tarballs.'
  session-query-sqlite-fork1:
    if: github.event_name == 'push' && github.ref == 'refs/tags/daily-driver-v0.1.7-rc.2-fork3'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: daily-driver-v0.1.7-rc.2-fork3
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.24.0
          package_json_file: packages/session-query/session-query-sqlite/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify session-query-only release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            test "$GITHUB_REF_NAME" = daily-driver-v0.1.7-rc.2-fork3
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/tags/daily-driver-v0.1.7-rc.2-fork3)"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const version = path => JSON.parse(readFileSync(path, 'utf8')).version
          assert.equal(version('apps/cli/package.json'), '0.1.7-rc.2')
          assert.equal(version('packages/bundle/web-app/package.json'), '0.1.7-rc.2')
          for (const [path, expected] of [
            ['session-query/session-query-sqlite', '0.1.7-rc.2-fork1'],
            ['session-query/session-query', '0.1.7-rc.2'],
            ['subagent/subagent', '0.1.7-rc.2-fork2'],
            ['llm/llm-pi-ai', '0.1.7-rc.2-fork1'],
            ['mcp/mcp-client', '0.1.7-rc.2-fork1'],
            ['core/agent', '0.1.7-rc.2-fork1'],
            ['preset/agent-preset-registry', '0.1.7-rc.2-fork1'],
          ]) assert.equal(version(`packages/${path}/package.json`), expected, path)
          NODE
          git merge-base --is-ancestor refs/tags/daily-driver-v0.1.7-rc.2-fork2 HEAD
      - name: Install source with pinned Pi fork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/daily-driver
          gh release download "$PI_RELEASE" --repo TTTPOB/deepseek-harness \
            --pattern 'earendil-works-pi-ai-0.85.1-fork1.tgz' --dir dist/daily-driver
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'pnpm-workspace.yaml'
          const source = readFileSync(path, 'utf8')
          const marker = '\npeerDependencyRules:'
          if (!source.includes(marker)) throw new Error('Missing workspace override insertion point')
          writeFileSync(path, source.replace(marker, "\n  '@earendil-works/pi-ai': 'file:dist/daily-driver/earendil-works-pi-ai-0.85.1-fork1.tgz'\n\nblockExoticSubdeps: false\n" + marker)
            .replace("  '@earendil-works/pi-ai@0.85.1': patches/@earendil-works__pi-ai@0.85.1.patch\n", ''))
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          manifest.packageManager = 'pnpm@11.24.0'
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          actual_pnpm=$(pnpm --version)
          echo "Release pnpm: $actual_pnpm"
          test "$actual_pnpm" = 11.24.0
          pnpm install --no-frozen-lockfile
      - name: Run focused session-query regression
        run: |
          pnpm run build:native-system
          pnpm exec vitest run packages/session-query
      - name: Build and pack only session-query-sqlite
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json packages/session-query/session-query-sqlite/tsconfig.json
          pnpm exec tsdown -F '@deepseek-ai/dsh-session-query-sqlite' --env.DSH_BUILD_FACE host
          pnpm --dir packages/session-query/session-query-sqlite pack --pack-destination "$PWD/dist/daily-driver"
      - name: Smoke installed tarball and record checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="$PWD/dist/daily-driver/deepseek-ai-dsh-session-query-sqlite-0.1.7-rc.2-fork1.tgz"
          test -s "$asset"
          runtime=$(mktemp -d)
          trap 'rm -rf "$runtime"' EXIT
          cp "$asset" "$runtime/"
          printf '{"name":"session-query-sqlite-fork1-smoke","private":true,"type":"module","packageManager":"pnpm@11.24.0","dependencies":{"@deepseek-ai/dsh":"0.1.7-rc.2"}}\n' > "$runtime/package.json"
          printf "packages:\n  - .\nblockExoticSubdeps: false\noverrides:\n  '@deepseek-ai/dsh-session-query-sqlite': 'file:./%s'\n" "$(basename "$asset")" > "$runtime/pnpm-workspace.yaml"
          (cd "$runtime" && pnpm install --ignore-scripts)
          SMOKE_RUNTIME="$runtime" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, realpathSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const runtime = process.env.SMOKE_RUNTIME
          const require = createRequire(join(runtime, 'package.json'))
          const cli = createRequire(require.resolve('@deepseek-ai/dsh/package.json'))
          const base = createRequire(cli.resolve('@deepseek-ai/dsh-base/package.json'))
          const manifest = base.resolve('@deepseek-ai/dsh-session-query-sqlite/package.json')
          assert.match(realpathSync(manifest), /file\+/)
          assert.equal(JSON.parse(readFileSync(manifest, 'utf8')).version, '0.1.7-rc.2-fork1')
          const loaded = await import(pathToFileURL(base.resolve('@deepseek-ai/dsh-session-query-sqlite')).href)
          assert(Object.keys(loaded).length > 0, 'Installed built entry has exports')
          assert.equal(loaded.SESSION_QUERY_SQLITE_DEFAULT_MAX_INDEXED_SESSION_BYTES, 33554432)
          assert.equal(new loaded.default.Config({ path: ':memory:' }).maxIndexedSessionBytes, 33554432)
          assert.throws(() => new loaded.default.Config({ path: ':memory:', maxIndexedSessionBytes: 0 }))
          console.log(`Resolved ${realpathSync(manifest)}; imported built entry; verified the default and rejected bounds`)
          NODE
          (cd dist/daily-driver && sha256sum deepseek-ai-dsh-session-query-sqlite-0.1.7-rc.2-fork1.tgz > SHA256SUMS)
      - name: Preserve verified session-query release assets
        uses: actions/upload-artifact@v4
        with:
          name: session-query-sqlite-fork1-release
          path: |
            dist/daily-driver/deepseek-ai-dsh-session-query-sqlite-0.1.7-rc.2-fork1.tgz
            dist/daily-driver/SHA256SUMS
          if-no-files-found: error
      - name: Publish immutable session-query-only release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=daily-driver-v0.1.7-rc.2-fork3
          current=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          test "$current" = "$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          cd dist/daily-driver
          gh release create "$tag" deepseek-ai-dsh-session-query-sqlite-0.1.7-rc.2-fork1.tgz SHA256SUMS \
            --verify-tag --title "$tag" --latest \
            --notes 'Only @deepseek-ai/dsh-session-query-sqlite advances to 0.1.7-rc.2-fork1. Keep the five existing DSH fork overrides, Pi AI fork1, official CLI/Web, and existing independent plugins unchanged. Replace only the @deepseek-ai/dsh-session-query-sqlite pnpm global override with this tarball, then run pnpm global add for @deepseek-ai/dsh@0.1.7-rc.2 using the existing installation procedure. This fork bounds a first index build with ctx.logger.warn reporting any stored session above maxIndexedSessionBytes instead of failing the build, and evicts a row once its stored log crosses that bound. The isolated smoke checks installed dependency resolution, built-entry import, the configured default bound, and schema rejection of an out-of-range bound; it does not verify Loader activation. This release contains no other package tarballs.'
  build:
    if: github.ref != 'refs/tags/daily-driver-v0.1.7-rc.2-fork2' && github.ref != 'refs/tags/daily-driver-v0.1.7-rc.2-fork3' && (github.event_name != 'workflow_dispatch' || !inputs.subagent_only)
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify fixed baseline and release identity
        id: identity
        run: |
          expected_tag="daily-driver-v${FORK_VERSION}"
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            test "$GITHUB_REF_NAME" = "$expected_tag"
          else
            test "$GITHUB_REF" = refs/heads/daily-driver
          fi
          node scripts/daily-driver.mjs verify
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
      - name: Fetch external plugin assets before source installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/daily-driver
          gh release download "$PI_RELEASE" --repo TTTPOB/deepseek-harness \
            --pattern 'earendil-works-pi-ai-0.85.1-fork1.tgz' --dir dist/daily-driver
          curl -fLsS -o dist/daily-driver/dsh-progressive-tools-0.3.0.tgz \
            https://github.com/TTTPOB/dsh-progressive-tools/releases/download/v0.3.0/dsh-progressive-tools-0.3.0.tgz
          firecrawl_url="${{ inputs.firecrawl_tarball_url || vars.DSH_FIRECRAWL_TARBALL_URL }}"
          test -n "$firecrawl_url"
          curl -fLsS -o dist/daily-driver/firecrawl-dsh-firecrawl-0.1.0-fork1.tgz "$firecrawl_url"
      - name: Install source with Pi override
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'pnpm-workspace.yaml'
          const source = readFileSync(path, 'utf8')
          const assets = {
            '@earendil-works/pi-ai': 'earendil-works-pi-ai-0.85.1-fork1.tgz',
          }
          const lines = Object.entries(assets).map(([name, file]) => `  '${name}': 'file:dist/daily-driver/${file}'`)
          writeFileSync(path, source.replace('\npeerDependencyRules:', `\n${lines.join('\n')}\n\nblockExoticSubdeps: false\n\npeerDependencyRules:`))
          NODE
          printf 'manage-package-manager-versions=false\n' >> .npmrc
          test "$(pnpm --version)" = 11.24.0
          pnpm install --no-frozen-lockfile
      - name: Build affected packages
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json \
            packages/subagent/subagent/tsconfig.json \
            packages/llm/llm-pi-ai/tsconfig.json \
            packages/mcp/mcp-client/tsconfig.json \
            packages/core/agent/tsconfig.json \
            packages/preset/agent-preset-registry/tsconfig.json
          for package in dsh-subagent dsh-llm-pi-ai dsh-mcp-client dsh-agent dsh-agent-preset-registry; do
            pnpm exec tsdown -F "@deepseek-ai/$package" --env.DSH_BUILD_FACE host
          done
      - name: Pack the five DSH forks
        run: |
          for package in subagent/subagent llm/llm-pi-ai mcp/mcp-client core/agent preset/agent-preset-registry; do
            pnpm --dir "packages/$package" pack --pack-destination "$PWD/dist/daily-driver"
          done
      - name: Require pinned workspace plugin source commits
        run: |
          [[ "${{ inputs.overlay_ref || vars.DSH_OVERLAY_REF }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.envrc_ref || vars.DSH_ENVRC_REF }}" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          repository: TTTPOB/dsh-workspace-overlay
          ref: ${{ inputs.overlay_ref || vars.DSH_OVERLAY_REF }}
          path: dist/source-overlay
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: TTTPOB/dsh-workspace-envrc
          ref: ${{ inputs.envrc_ref || vars.DSH_ENVRC_REF }}
          path: dist/source-envrc
          persist-credentials: false
      - name: Build and pack workspace overlay from pinned source
        run: |
          printf "overrides:\n  '@deepseek-ai/dsh-agent': 'file:../daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz'\n  '@deepseek-ai/dsh-agent-preset-registry': 'file:../daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz'\nblockExoticSubdeps: false\n" >> dist/source-overlay/pnpm-workspace.yaml
          pnpm --dir dist/source-overlay install --no-frozen-lockfile
          pnpm --dir dist/source-overlay run build
          pnpm --dir dist/source-overlay pack --pack-destination "$PWD/dist/daily-driver"
      - name: Build and pack workspace envrc from pinned source
        run: |
          printf "overrides:\n  '@deepseek-ai/dsh-agent': 'file:../daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz'\n  '@deepseek-ai/dsh-agent-preset-registry': 'file:../daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz'\n  'dsh-workspace-overlay': 'file:../daily-driver/dsh-workspace-overlay-0.2.0.tgz'\nblockExoticSubdeps: false\n" >> dist/source-envrc/pnpm-workspace.yaml
          pnpm --dir dist/source-envrc install --no-frozen-lockfile
          pnpm --dir dist/source-envrc run build
          pnpm --dir dist/source-envrc pack --pack-destination "$PWD/dist/daily-driver"
      - name: Verify isolated project dependency closure
        run: >-
          node scripts/daily-driver.mjs smoke
          dist/daily-driver/deepseek-ai-dsh-subagent-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-llm-pi-ai-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-mcp-client-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/earendil-works-pi-ai-0.85.1-fork1.tgz
          dist/daily-driver/dsh-progressive-tools-0.3.0.tgz
          dist/daily-driver/dsh-workspace-overlay-0.2.0.tgz
          dist/daily-driver/dsh-workspace-envrc-0.2.0.tgz
          dist/daily-driver/firecrawl-dsh-firecrawl-0.1.0-fork1.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-package
          path: dist/daily-driver/*
          if-no-files-found: error
  publish:
    if: github.ref != 'refs/tags/daily-driver-v0.1.7-rc.2-fork2' && github.ref != 'refs/tags/daily-driver-v0.1.7-rc.2-fork3' && (github.event_name != 'workflow_dispatch' || !inputs.subagent_only)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daily-driver-package
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            current=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          else
            current=$(gh api "repos/$GH_REPO/git/ref/heads/daily-driver" --jq '.object.sha')
          fi
          test "$current" = "$COMMIT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          cd release
          gh release create "$TAG" ./*.tgz runtime-cli-package.json runtime-cli-pnpm-workspace.yaml runtime-cli-pnpm-lock.yaml runtime-profile-package.json runtime-profile-pnpm-lock.yaml \
            --target "$COMMIT" --title "$TAG" --latest \
            --notes 'Official DSH 0.1.7-rc.2 CLI with five DSH fork1 overrides, Pi AI fork1, official Web app, and four ordinary shared-plugin tarballs plus MCP Panel 0.6.19. CLI and profile dependency smoke does not verify Loader behavior.'
