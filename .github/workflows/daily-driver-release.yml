          const loaded = await import(pathToFileURL(base.resolve('@deepseek-ai/dsh-session-query-sqlite')).href)
          assert(Object.keys(loaded).length > 0, 'Installed built entry has exports')
          assert.equal(loaded.SESSION_QUERY_SQLITE_DEFAULT_MAX_INDEXED_SESSION_BYTES, 33554432)
          assert.equal(new loaded.default.Config({ path: ':memory:' }).maxIndexedSessionBytes, 33554432)
          assert.throws(() => new loaded.default.Config({ path: ':memory:', maxIndexedSessionBytes: 0 }))
          console.log(`Resolved ${realpathSync(manifest)}; imported built entry; verified the default and rejected bounds`)
