name: Daily-driver pinned package release

on:
  push:
    tags:
      - 'daily-driver-v*-fork*'
  workflow_dispatch:
    inputs:
      firecrawl_tarball_url:
        description: Immutable URL of the adapted Firecrawl fork1 tarball
        required: true
        type: string
      overlay_ref:
        description: Exact tested source commit for workspace overlay
        required: true
        type: string
      envrc_ref:
        description: Exact tested source commit for workspace envrc
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-driver-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  BASE_VERSION: 0.1.7-rc.2
  FORK_VERSION: 0.1.7-rc.2-fork1
  PI_RELEASE: daily-driver-v0.1.5-rc.2-fork1

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify fixed baseline and release identity
        id: identity
        run: |
          expected_tag="daily-driver-v${FORK_VERSION}"
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            test "$GITHUB_REF_NAME" = "$expected_tag"
          else
            test "$GITHUB_REF" = refs/heads/daily-driver
          fi
          node scripts/daily-driver.mjs verify
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
      - name: Fetch external plugin assets before source installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/daily-driver
          gh release download "$PI_RELEASE" --repo TTTPOB/deepseek-harness \
            --pattern 'earendil-works-pi-ai-0.85.1-fork1.tgz' --dir dist/daily-driver
          curl -fLsS -o dist/daily-driver/dsh-progressive-tools-0.3.0.tgz \
            https://github.com/TTTPOB/dsh-progressive-tools/releases/download/v0.3.0/dsh-progressive-tools-0.3.0.tgz
          firecrawl_url="${{ inputs.firecrawl_tarball_url || vars.DSH_FIRECRAWL_TARBALL_URL }}"
          test -n "$firecrawl_url"
          curl -fLsS -o dist/daily-driver/firecrawl-dsh-firecrawl-0.1.0-fork1.tgz "$firecrawl_url"
      - name: Install source with Pi override
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'pnpm-workspace.yaml'
          const source = readFileSync(path, 'utf8')
          const assets = {
            '@earendil-works/pi-ai': 'earendil-works-pi-ai-0.85.1-fork1.tgz',
          }
          const lines = Object.entries(assets).map(([name, file]) => `  '${name}': 'file:dist/daily-driver/${file}'`)
          writeFileSync(path, source.replace('\npeerDependencyRules:', `\n${lines.join('\n')}\n\nblockExoticSubdeps: false\n\npeerDependencyRules:`))
          NODE
          printf 'manage-package-manager-versions=false\n' >> .npmrc
          test "$(pnpm --version)" = 11.24.0
          pnpm install --no-frozen-lockfile
      - name: Build affected packages
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json \
            packages/subagent/subagent/tsconfig.json \
            packages/llm/llm-pi-ai/tsconfig.json \
            packages/mcp/mcp-client/tsconfig.json \
            packages/core/agent/tsconfig.json \
            packages/preset/agent-preset-registry/tsconfig.json
          for package in dsh-subagent dsh-llm-pi-ai dsh-mcp-client dsh-agent dsh-agent-preset-registry; do
            pnpm exec tsdown -F "@deepseek-ai/$package" --env.DSH_BUILD_FACE host
          done
      - name: Pack the five DSH forks
        run: |
          for package in subagent/subagent llm/llm-pi-ai mcp/mcp-client core/agent preset/agent-preset-registry; do
            pnpm --dir "packages/$package" pack --pack-destination "$PWD/dist/daily-driver"
          done
      - name: Require pinned workspace plugin source commits
        run: |
          [[ "${{ inputs.overlay_ref || vars.DSH_OVERLAY_REF }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.envrc_ref || vars.DSH_ENVRC_REF }}" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          repository: TTTPOB/dsh-workspace-overlay
          ref: ${{ inputs.overlay_ref || vars.DSH_OVERLAY_REF }}
          path: dist/source-overlay
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: TTTPOB/dsh-workspace-envrc
          ref: ${{ inputs.envrc_ref || vars.DSH_ENVRC_REF }}
          path: dist/source-envrc
          persist-credentials: false
      - name: Build and pack workspace overlay from pinned source
        run: |
          printf "overrides:\n  '@deepseek-ai/dsh-agent': 'file:../daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz'\n  '@deepseek-ai/dsh-agent-preset-registry': 'file:../daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz'\nblockExoticSubdeps: false\n" >> dist/source-overlay/pnpm-workspace.yaml
          pnpm --dir dist/source-overlay install --no-frozen-lockfile
          pnpm --dir dist/source-overlay run build
          pnpm --dir dist/source-overlay pack --pack-destination "$PWD/dist/daily-driver"
      - name: Build and pack workspace envrc from pinned source
        run: |
          printf "overrides:\n  '@deepseek-ai/dsh-agent': 'file:../daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz'\n  '@deepseek-ai/dsh-agent-preset-registry': 'file:../daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz'\n  'dsh-workspace-overlay': 'file:../daily-driver/dsh-workspace-overlay-0.2.0.tgz'\nblockExoticSubdeps: false\n" >> dist/source-envrc/pnpm-workspace.yaml
          pnpm --dir dist/source-envrc install --no-frozen-lockfile
          pnpm --dir dist/source-envrc run build
          pnpm --dir dist/source-envrc pack --pack-destination "$PWD/dist/daily-driver"
      - name: Verify isolated project dependency closure
        run: >-
          node scripts/daily-driver.mjs smoke
          dist/daily-driver/deepseek-ai-dsh-subagent-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-llm-pi-ai-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-mcp-client-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-agent-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-agent-preset-registry-0.1.7-rc.2-fork1.tgz
          dist/daily-driver/earendil-works-pi-ai-0.85.1-fork1.tgz
          dist/daily-driver/dsh-progressive-tools-0.3.0.tgz
          dist/daily-driver/dsh-workspace-overlay-0.2.0.tgz
          dist/daily-driver/dsh-workspace-envrc-0.2.0.tgz
          dist/daily-driver/firecrawl-dsh-firecrawl-0.1.0-fork1.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-package
          path: dist/daily-driver/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daily-driver-package
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            current=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          else
            current=$(gh api "repos/$GH_REPO/git/ref/heads/daily-driver" --jq '.object.sha')
          fi
          test "$current" = "$COMMIT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          cd release
          gh release create "$TAG" ./*.tgz runtime-cli-package.json runtime-cli-pnpm-workspace.yaml runtime-cli-pnpm-lock.yaml runtime-profile-package.json runtime-profile-pnpm-lock.yaml \
            --target "$COMMIT" --title "$TAG" --latest \
            --notes 'Official DSH 0.1.7-rc.2 CLI with five DSH fork1 overrides, Pi AI fork1, official Web app, and four ordinary shared-plugin tarballs plus MCP Panel 0.6.19. CLI and profile dependency smoke does not verify Loader behavior.'
