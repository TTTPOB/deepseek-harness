            .replace("  '@earendil-works/pi-ai@0.85.1': patches/@earendil-works__pi-ai@0.85.1.patch\n", ''))
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          manifest.packageManager = 'pnpm@11.24.0'
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
          actual_pnpm=$(pnpm --version)
          echo "Release pnpm: $actual_pnpm"
          test "$actual_pnpm" = 11.24.0
          pnpm install --no-frozen-lockfile
      - name: Run focused session-query regression
        run: |
          pnpm run build:native-system
          pnpm exec vitest run packages/session-query
      - name: Build and pack only session-query-sqlite
        run: |
          pnpm exec tsc -b packages/typert/generator/tsconfig.json packages/session-query/session-query-sqlite/tsconfig.json
          pnpm exec tsdown -F '@deepseek-ai/dsh-session-query-sqlite' --env.DSH_BUILD_FACE host
          pnpm --dir packages/session-query/session-query-sqlite pack --pack-destination "$PWD/dist/daily-driver"
      - name: Smoke installed tarball and record checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="$PWD/dist/daily-driver/deepseek-ai-dsh-session-query-sqlite-0.1.7-rc.2-fork1.tgz"
