name: Daily-driver pinned package release

on:
  push:
    tags:
      - 'daily-driver-v*-fork*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-driver-release
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  BASE_VERSION: 0.1.5-rc.2
  FORK_VERSION: 0.1.5-rc.2-fork1
  PI_RELEASE: pi-ai-v0.85.1-fork1

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify fixed baseline and release identity
        id: identity
        run: |
          expected_tag="daily-driver-v${FORK_VERSION}"
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            test "$GITHUB_REF_NAME" = "$expected_tag"
          else
            test "$GITHUB_REF" = refs/heads/daily-driver
          fi
          node scripts/daily-driver.mjs verify
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Verify changed packages
        run: |
          pnpm exec vitest run packages/subagent/subagent/tests/continuation-messages.spec.ts packages/llm/llm-pi-ai/tests packages/mcp/mcp-client/tests/mcp-client.spec.ts packages/mcp/mcp-client/tests/apply.spec.ts packages/mcp/mcp-client/tests/reconnect.spec.ts packages/mcp/mcp-client/tests/egress.spec.ts
          pnpm exec vitest run --config vitest.e2e.config.ts packages/mcp/mcp-client/tests/mcp-client.e2e.ts
      - name: Build official packages
        run: pnpm run build:official
      - name: Pack four overrides
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/daily-driver
          pnpm --dir packages/subagent/subagent pack --pack-destination "$PWD/dist/daily-driver"
          pnpm --dir packages/llm/llm-pi-ai pack --pack-destination "$PWD/dist/daily-driver"
          pnpm --dir packages/mcp/mcp-client pack --pack-destination "$PWD/dist/daily-driver"
          gh release download "$PI_RELEASE" --repo TTTPOB/pi --pattern 'earendil-works-pi-ai-*.tgz' --dir dist/daily-driver
      - name: Verify isolated installation-wide overrides
        run: >-
          node scripts/daily-driver.mjs smoke
          dist/daily-driver/deepseek-ai-dsh-subagent-0.1.5-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-llm-pi-ai-0.1.5-rc.2-fork1.tgz
          dist/daily-driver/deepseek-ai-dsh-mcp-client-0.1.5-rc.2-fork1.tgz
          dist/daily-driver/earendil-works-pi-ai-0.85.1-fork1.tgz
      - name: Checksum tested runtime and overrides
        working-directory: dist/daily-driver
        run: sha256sum ./*.tgz runtime-package.json runtime-pnpm-workspace.yaml runtime-pnpm-lock.yaml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-package
          path: dist/daily-driver/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daily-driver-package
          path: release
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" = push ]]; then
            current=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')
          else
            current=$(gh api "repos/$GH_REPO/git/ref/heads/daily-driver" --jq '.object.sha')
          fi
          test "$current" = "$COMMIT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never overwritten." >&2
            exit 1
          fi
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$TAG" ./*.tgz runtime-package.json runtime-pnpm-workspace.yaml runtime-pnpm-lock.yaml SHA256SUMS \
            --target "$COMMIT" --title "$TAG" --latest \
            --notes 'Fixed official DSH 0.1.5-rc.2 baseline. Installation-wide pnpm overrides replace subagent settlement guidance, llm-pi-ai deferred-tool/final parsing and Responses instructions support, MCP SDK v2 client, and Pi AI 0.85.1-fork1. Install all four fork1 assets together; runtime-package.json records the tested dependency graph.'
