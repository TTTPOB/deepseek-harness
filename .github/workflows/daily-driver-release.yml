          pnpm exec tsc -b packages/typert/generator/tsconfig.json packages/session/session-persistence-jsonl/tsconfig.json packages/session-query/session-query-sqlite/tsconfig.json
          for package in dsh-session-persistence-jsonl dsh-session-query-sqlite; do
