          assert.equal(version('apps/cli/package.json'), '0.1.7-rc.2')
          assert.equal(version('packages/bundle/web-app/package.json'), '0.1.7-rc.2')
          for (const [path, expected] of [
            ['session-query/session-query-sqlite', '0.1.7-rc.2-fork1'],
            ['session-query/session-query', '0.1.7-rc.2'],
            ['subagent/subagent', '0.1.7-rc.2-fork2'],
            ['llm/llm-pi-ai', '0.1.7-rc.2-fork1'],
            ['mcp/mcp-client', '0.1.7-rc.2-fork1'],
            ['core/agent', '0.1.7-rc.2-fork1'],
            ['preset/agent-preset-registry', '0.1.7-rc.2-fork1'],
          ]) assert.equal(version(`packages/${path}/package.json`), expected, path)
          NODE
          git merge-base --is-ancestor refs/tags/daily-driver-v0.1.7-rc.2-fork2 HEAD
