name: Daily-driver verify

on:
  push:
    branches: [daily-driver]
  workflow_dispatch:
    inputs:
      selection:
        description: Current capability to validate
        type: choice
        required: true
        default: session-query
        options: [session-query, core, access, subagent]

permissions:
  contents: read

concurrency:
  group: daily-driver-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=3072

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate current source and isolated artifacts
        env:
          SELECTION: ${{ inputs.selection || 'session-query' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/daily-driver.mjs prepare "$SELECTION"
          node scripts/daily-driver.mjs verify "$SELECTION"
          node scripts/daily-driver.mjs build "$SELECTION"
          node scripts/daily-driver.mjs smoke "$SELECTION"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-driver-verify-artifacts
          path: dist/daily-driver/*
          if-no-files-found: error
