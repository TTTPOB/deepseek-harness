# Personal Web host composition; keep credential-bearing MCP server rows in the profile.
- id: agent-preset-registry
  config:
    default: standard-ptc

# Keep official DeepSeek search; Firecrawl supplies only fetch.
- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: firecrawl

- insert:
    - id: progressive-tools
      name: dsh-progressive-tools
      config:
        deferTools: mcp

    - id: workspace-registry
      name: dsh-workspace-overlay
      config:
        trustWorkspaceConfig: true
        watchWorkspaceConfig: true
        reloadDebounceMs: 150
    - id: workspace-mcp-manager
      name: dsh-workspace-overlay/mcp/manager
    - id: workspace-agent-integration
      name: dsh-workspace-overlay/integration-plugin

    - id: workspace-envrc
      name: dsh-workspace-envrc
      config:
        executable: direnv
        shimShell: /bin/bash
        enableBash: true
        enableWorkspaceMcp: true
        versionCheckTimeoutMs: 5000
    - id: workspace-envrc-integration
      name: dsh-workspace-envrc/integration-plugin

    - id: web-fetch-firecrawl
      name: '@firecrawl/dsh-firecrawl/fetch'

    - id: mcp-panel
      name: dsh-mcp-panel
